services:
  postgres-product:
    image: postgres:17
    container_name: postgres-product
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: product
      POSTGRES_PASSWORD: product123
      POSTGRES_DB: product_service
    # 首次创建数据卷时按字母序执行 Flyway 迁移脚本(V1..V6)建表；
    # 已存在的卷不会重跑(幂等)。重建 schema: docker compose down -v && up -d
    volumes:
      - ./product-service/src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product -d product_service"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres-inventory:
    image: postgres:17
    container_name: postgres-inventory
    ports: ["5434:5432"]
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory123
      POSTGRES_DB: inventory_service
    volumes:
      - ./inventory-service/src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_service"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres-order:
    image: postgres:17
    container_name: postgres-order
    ports: ["5435:5432"]
    environment:
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order123
      POSTGRES_DB: order_service
    volumes:
      - ./order-service/src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d order_service"]
      interval: 5s
      timeout: 3s
      retries: 10
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports: ["9092:9092"]
    # confluentinc/cp-kafka 使用 KAFKA_* 环境变量（非 bitnami 的 KAFKA_CFG_*）；KRaft 单节点
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  redis:
    image: redis:latest
    container_name: redis
    ports: ["6379:6379"]
  product-service:
    build: ./product-service
    container_name: product-service
    # 仅回环绑定，避免未鉴权 internal 端点暴露到局域网
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      postgres-product:
        condition: service_healthy
    environment:
      DB_HOST: postgres-product
      DB_PORT: "5432"
      DB_NAME: product_service
      DB_USER: product
      DB_PASSWORD: product123
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED: "false"
      # 服务间共享 token, /internal/** 需携带 X-Internal-Token
      INTERNAL_API_TOKEN: dev-internal-token
      # initdb 已在 /docker-entrypoint-initdb.d 建表 -> 非空 schema 无 history 时打 baseline 到最新版本
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "6"
  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    # 仅回环绑定，避免未鉴权 internal 端点暴露到局域网
    ports: ["127.0.0.1:8082:8082"]
    depends_on:
      postgres-inventory:
        condition: service_healthy
    environment:
      DB_HOST: postgres-inventory
      DB_PORT: "5432"
      DB_NAME: inventory_service
      DB_USER: inventory
      DB_PASSWORD: inventory123
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERNAL_API_TOKEN: dev-internal-token
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "1"
  order-service:
    build: ./order-service
    container_name: order-service
    # 仅回环绑定，避免未鉴权 internal 端点暴露到局域网
    ports: ["127.0.0.1:8083:8083"]
    depends_on:
      postgres-order:
        condition: service_healthy
    environment:
      DB_HOST: postgres-order
      DB_PORT: "5432"
      DB_NAME: order_service
      DB_USER: order
      DB_PASSWORD: order123
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8081
      INTERNAL_API_TOKEN: dev-internal-token
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "2"
