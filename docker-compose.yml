services:
  postgres-product:
    image: postgres:16
    container_name: postgres-product
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: product
      POSTGRES_PASSWORD: product123
      POSTGRES_DB: product_service
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product -d product_service"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres-inventory:
    image: postgres:16
    container_name: postgres-inventory
    ports: ["5434:5432"]
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory123
      POSTGRES_DB: inventory_service
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_service"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres-order:
    image: postgres:16
    container_name: postgres-order
    ports: ["5435:5432"]
    environment:
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order123
      POSTGRES_DB: order_service
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d order_service"]
      interval: 5s
      timeout: 3s
      retries: 10
  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
  redis:
    image: redis:7
    container_name: redis
    ports: ["6379:6379"]
  product-service:
    build: ./product-service
    container_name: product-service
    ports: ["8081:8081"]
    depends_on:
      postgres-product:
        condition: service_healthy
    environment:
      DB_HOST: postgres-product
      DB_PORT: "5432"
      DB_NAME: product_service
      DB_USER: product
      DB_PASSWORD: product123
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED: "false"
  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    ports: ["8082:8082"]
    depends_on:
      postgres-inventory:
        condition: service_healthy
    environment:
      DB_HOST: postgres-inventory
      DB_PORT: "5432"
      DB_NAME: inventory_service
      DB_USER: inventory
      DB_PASSWORD: inventory123
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  order-service:
    build: ./order-service
    container_name: order-service
    ports: ["8083:8083"]
    depends_on:
      postgres-order:
        condition: service_healthy
    environment:
      DB_HOST: postgres-order
      DB_PORT: "5432"
      DB_NAME: order_service
      DB_USER: order
      DB_PASSWORD: order123
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8081
