server: { port: 8083 }
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:order_service}
    username: ${DB_USER:order}
    password: ${DB_PASSWORD:order123}
  jpa:
    hibernate: { ddl-auto: validate }
    properties: { hibernate: { dialect: org.hibernate.dialect.PostgreSQLDialect } }
  flyway: { enabled: true, locations: classpath:db/migration }
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: order-payment
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.order.event"
        spring.json.value.default.type: com.order.event.OrderEvent
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
management: { endpoints: { web: { exposure: { include: health,metrics } } } }
inventory:
  service: { url: ${INVENTORY_SERVICE_URL:http://localhost:8082} }
product:
  service: { url: ${PRODUCT_SERVICE_URL:http://localhost:8081} }
