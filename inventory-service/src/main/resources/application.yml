server: { port: 8082 }
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:inventory_service}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory123}
  jpa:
    hibernate: { ddl-auto: validate }
    properties: { hibernate: { dialect: org.hibernate.dialect.PostgreSQLDialect } }
  flyway: { enabled: true, locations: classpath:db/migration }
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: inventory-order-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.inventory.event"
        spring.json.value.default.type: com.inventory.event.OrderEvent
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
management: { endpoints: { web: { exposure: { include: health,metrics } } } }
internal:
  api:
    token: ${INTERNAL_API_TOKEN:dev-internal-token}
